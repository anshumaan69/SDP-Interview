name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sdp_interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter "@sdp/api" db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sdp_interview?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "test_jwt_access_secret_1234567890"
          JWT_REFRESH_SECRET: "test_jwt_refresh_secret_1234567890"

      - name: Build
        run: pnpm build
